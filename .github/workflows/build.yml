name: build
on: [ push, pull_request ]
jobs:
  verify:
    # This fork only exists to benchmark zio-http from zio-http's CI, so verify that
    # the zio-http test still builds and passes TFB's verification against zio-http main.
    # This mirrors what zio-http's "Performance Benchmarks" job does before running tfb.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare zio-http test
        run: |
          cd frameworks/Scala/zio-http
          git init .
          git config user.email 'benchmark@example.com'
          git config user.name 'ZIO Benchmark'
          git add build.sbt
          git commit -m 'initial commit'
          git tag v1.0.0
          git clone https://github.com/zio/zio-http.git
          mkdir -p src/main/scala
          cp zio-http/zio-http-example/src/main/scala/example/PlainTextBenchmarkServer.scala src/main/scala/Main.scala
      - name: Verify zio-http test
        run: ./tfb --mode verify --test zio-http

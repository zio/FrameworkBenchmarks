version: 2
updates:
  # Maintain Docker base images for zio-http
  - package-ecosystem: "docker"
    directory: "/frameworks/Scala/zio-http"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"

  # Maintain GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
